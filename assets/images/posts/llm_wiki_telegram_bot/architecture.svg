<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4b2"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0b25c"/>
    </marker>
  </defs>

  <rect width="700" height="500" fill="#252a34"/>

  <!-- 스케줄러 (봇 서버 바로 위) -->
  <rect x="230" y="20" width="180" height="80" rx="10" fill="#3b4252" stroke="#8f7ae0" stroke-width="1.5"/>
  <text x="320" y="52" fill="#f2f4f8" font-size="15" text-anchor="middle" font-weight="600">스케줄러</text>
  <text x="320" y="74" fill="#c3cad6" font-size="12" text-anchor="middle">체크인 · 자정 일기</text>

  <!-- 텔레그램 -->
  <rect x="30" y="170" width="140" height="70" rx="10" fill="#3b4252" stroke="#6b7a99" stroke-width="1.5"/>
  <text x="100" y="200" fill="#f2f4f8" font-size="16" text-anchor="middle" font-weight="600">텔레그램</text>
  <text x="100" y="222" fill="#c3cad6" font-size="12" text-anchor="middle">사용자</text>

  <!-- 봇 서버 -->
  <rect x="230" y="150" width="180" height="110" rx="10" fill="#3b4252" stroke="#6b7a99" stroke-width="1.5"/>
  <text x="320" y="185" fill="#f2f4f8" font-size="16" text-anchor="middle" font-weight="600">봇 서버</text>
  <text x="320" y="208" fill="#c3cad6" font-size="12" text-anchor="middle">대화 처리 · 명령어</text>
  <text x="320" y="228" fill="#c3cad6" font-size="12" text-anchor="middle">일정/알림 관리</text>

  <!-- LLM -->
  <rect x="470" y="150" width="180" height="110" rx="10" fill="#3b4252" stroke="#8fb37a" stroke-width="1.5"/>
  <text x="560" y="185" fill="#f2f4f8" font-size="16" text-anchor="middle" font-weight="600">LLM</text>
  <text x="560" y="208" fill="#c3cad6" font-size="12" text-anchor="middle">Gemini / Claude</text>
  <text x="560" y="228" fill="#c3cad6" font-size="12" text-anchor="middle">(전환 가능)</text>

  <!-- 저장소 -->
  <rect x="230" y="340" width="180" height="100" rx="10" fill="#3b4252" stroke="#6b7a99" stroke-width="1.5"/>
  <text x="320" y="373" fill="#f2f4f8" font-size="16" text-anchor="middle" font-weight="600">저장소</text>
  <text x="320" y="395" fill="#c3cad6" font-size="12" text-anchor="middle">옵시디언 일기 · DB</text>
  <text x="320" y="413" fill="#8891a0" font-size="11" text-anchor="middle">(raw 원본 역할)</text>

  <!-- LLM Wiki -->
  <rect x="470" y="340" width="180" height="100" rx="10" fill="#3b4252" stroke="#e0b25c" stroke-width="1.5"/>
  <text x="560" y="373" fill="#f2f4f8" font-size="16" text-anchor="middle" font-weight="600">LLM Wiki</text>
  <text x="560" y="395" fill="#c3cad6" font-size="12" text-anchor="middle">인물·장소 지식</text>
  <text x="560" y="413" fill="#8891a0" font-size="11" text-anchor="middle">(compile된 결과, 읽기전용)</text>

  <!-- arrows: 스케줄러 -> 봇 서버 -->
  <line x1="320" y1="100" x2="320" y2="148" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="128" fill="#8891a0" font-size="11" text-anchor="middle">트리거</text>

  <!-- 텔레그램 <-> 봇 서버 -->
  <line x1="170" y1="195" x2="228" y2="195" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="228" y1="215" x2="170" y2="215" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="199" y="252" fill="#8891a0" font-size="11" text-anchor="middle">대화</text>

  <!-- 봇 서버 <-> LLM -->
  <line x1="410" y1="195" x2="468" y2="195" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="468" y1="215" x2="410" y2="215" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="180" fill="#8891a0" font-size="11" text-anchor="middle">질의/응답</text>

  <!-- 봇 서버 -> 저장소 -->
  <line x1="320" y1="260" x2="320" y2="338" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="300" fill="#8891a0" font-size="11" text-anchor="middle">기록</text>

  <!-- LLM -> LLM Wiki -->
  <line x1="560" y1="260" x2="560" y2="338" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="300" fill="#8891a0" font-size="11" text-anchor="middle">참조</text>

  <!-- 저장소 -> LLM (직접 참조, tool call) -->
  <line x1="392" y1="340" x2="488" y2="262" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="292" fill="#8891a0" font-size="11" text-anchor="middle">과거 기록 조회</text>

  <!-- 저장소 -> LLM Wiki (raw -> compile, 외부/주기적) -->
  <line x1="410" y1="390" x2="468" y2="390" stroke="#e0b25c" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-dashed)"/>
  <text x="440" y="462" fill="#c9a463" font-size="11" text-anchor="middle">raw → compile</text>
  <text x="440" y="477" fill="#8891a0" font-size="10" text-anchor="middle">(주기적, 봇 외부 파이프라인)</text>
</svg>
